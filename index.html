<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk Server Minecraft Bedrock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap">
<style>
/* Gaya Ore UI: panel abu gelap, tombol bevel, hijau (hero/primary), putih (secondary), merah (destructive) */
:root{
  --bg:#313233; --panel:#48494A; --panel-d:#1E1E1F; --line:#8C8D90; --text:#FFFFFF; --muted:#B1B2B5; --err:#FF8080;
  --g:#3C8527; --g-hi:#52A535; --g-sh:#2A641C; --g-bd:#1D4D13;
  --w:#D0D1D4; --w-hi:#ECEDEE; --w-sh:#8C8D90; --w-bd:#1E1E1F;
  --r:#CA3636; --r-hi:#E35A5A; --r-sh:#8E1F1F; --r-bd:#4F1010;
  --font:"Pixelify Sans","Noto Sans",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;overflow-x:hidden;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45}
main{max-width:480px;margin:0 auto;padding:16px 14px 40px}
.card{background:var(--panel);border:2px solid var(--panel-d);box-shadow:inset 0 2px 0 #5F6062,0 4px 0 #1E1E1F;margin-bottom:20px}
.card>.body{padding:6px 16px 18px}
h1,h2{margin:0;font-weight:700;background:var(--panel-d);padding:14px 16px;border-bottom:2px solid #000}
h1{font-size:22px;line-height:1.25}
h2{font-size:18px}
label{display:block;margin:14px 0 6px;color:var(--muted);font-size:15px}
input{width:100%;font:inherit;font-size:17px;color:var(--text);background:var(--panel-d);border:2px solid #0f0f10;box-shadow:inset 0 2px 0 #000;padding:11px 12px;border-radius:0;outline:none}
input::placeholder{color:#7d7e80}
input:hover{border-color:var(--line)}
input:focus-visible{border-color:#fff}
input.bad{border-color:var(--err)}
.err{color:var(--err);font-size:14px;min-height:20px;margin-top:4px}
/* Tombol dasar = Primary (hijau) */
.btn{font:inherit;font-size:17px;font-weight:700;line-height:1.2;color:#fff;background:var(--g);border:2px solid var(--g-bd);
  box-shadow:inset 0 2px 0 var(--g-hi),inset 0 -4px 0 var(--g-sh);padding:12px 12px 14px;width:100%;cursor:pointer;border-radius:0;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn:hover{background:#44962D}
.btn:active{padding:14px 12px 12px;box-shadow:inset 0 4px 0 var(--g-sh)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* Secondary (putih) */
.btn.alt{background:var(--w);color:#1E1E1F;border-color:var(--w-bd);box-shadow:inset 0 2px 0 var(--w-hi),inset 0 -4px 0 var(--w-sh);text-shadow:none}
.btn.alt:hover{background:#E1E2E4}
.btn.alt:active{box-shadow:inset 0 4px 0 var(--w-sh)}
/* Destructive (merah) */
.btn.danger{background:var(--r);border-color:var(--r-bd);box-shadow:inset 0 2px 0 var(--r-hi),inset 0 -4px 0 var(--r-sh)}
.btn.danger:hover{background:#D64242}
.btn.danger:active{box-shadow:inset 0 4px 0 var(--r-sh)}
/* Hero (hijau besar untuk aksi utama) */
.btn.main{font-size:22px;padding:16px 12px 20px;margin-top:20px}
.btn.main:active{padding:20px 12px 16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.msg{margin-top:14px;font-size:15px;color:var(--muted);min-height:22px}
.msg a{color:#7FD65F;word-break:break-all}
.note{font-size:13px;color:var(--muted);margin:16px 0 0}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{display:flex;flex-direction:column;align-items:stretch;gap:10px;background:var(--panel-d);border:2px solid #0f0f10;padding:10px 12px}
.info{flex:none;width:100%;min-width:0;cursor:pointer;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:4px 0}
.info:hover .nm{text-decoration:underline}
.info:focus-visible{outline:2px solid #fff}
.nm{display:block;font-size:18px;font-weight:700;overflow-wrap:anywhere}
.ad{display:block;color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.acts .btn{padding:9px 6px 11px;font-size:15px;min-height:44px}
.acts .btn:active{padding:11px 6px 9px}
.chk{display:flex;gap:10px;align-items:flex-start;color:var(--text);font-size:14px;margin:16px 0 0}
.chk input{width:22px;height:22px;flex:none;padding:0;margin:0;accent-color:#3C8527;box-shadow:none}
main{padding-bottom:120px}
.panel{animation:in .25s ease}
.panel[hidden]{display:none}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.tab{transition:none}}
.soon{text-align:center;padding:26px 8px}
.soon b{display:block;font-size:24px;margin-bottom:6px}
.soon span{color:var(--muted)}
/* Menu bawah berbentuk kapsul, melayang dan mengikuti layar */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:6px;background:#1E1E1F;border:2px solid #000;border-radius:999px;box-shadow:inset 0 2px 0 #3a3b3c,0 8px 18px rgba(0,0,0,.55);z-index:10;max-width:calc(100vw - 20px)}
.tab{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;white-space:nowrap;border:0;border-radius:999px;background:transparent;color:var(--muted);font:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s,color .2s}
.tab svg{width:16px;height:16px;fill:currentColor;shape-rendering:crispEdges}
.tab:hover{color:#fff;background:#2b2c2d}
.tab[aria-selected="true"]{background:var(--g);color:#fff;box-shadow:inset 0 2px 0 var(--g-hi),inset 0 -3px 0 var(--g-sh)}
.tab:focus-visible{outline:2px solid #fff;outline-offset:2px}
.st{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.st.on{color:#7FD65F}
.st.off{color:#FF8080}
#chk{margin:0;flex:1;min-width:0}
.chkrow{display:flex;align-items:center;gap:10px;margin-top:6px}
.btn.mini{width:auto;flex:none;font-size:12px;padding:3px 10px 5px;box-shadow:inset 0 2px 0 var(--w-hi),inset 0 -2px 0 var(--w-sh)}
.btn.mini:active{padding:5px 10px 3px;box-shadow:inset 0 2px 0 var(--w-sh)}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#1E1E1F;background:#FFE34D;border:2px solid #1E1E1F;padding:0 6px;margin-bottom:4px}
.btn.dim,.btn.alt.dim{background:#58595A;color:#9A9B9D;border-color:#2A2A2B;box-shadow:inset 0 2px 0 #6A6B6C,inset 0 -4px 0 #404142;text-shadow:none;cursor:not-allowed}
.btn.mini.dim{box-shadow:inset 0 2px 0 #6A6B6C,inset 0 -2px 0 #404142}
.btn.dim:hover,.btn.alt.dim:hover{background:#58595A}
.empty{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<main>
<div class="panel" id="tab-connect" role="tabpanel" aria-labelledby="t-connect">
  <section class="card">
    <h1>Ayo masuk ke server Anda!</h1>
<div class="body">

    <label for="name">Nama</label>
    <input id="name" type="text" placeholder="My Server" maxlength="40" autocomplete="off">

    <label for="ip">IP / Alamat Server</label>
    <input id="ip" type="text" placeholder="play.contoh.com" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="ipErr">
    <div class="err" id="ipErr" role="alert"></div>

    <label for="port">Port</label>
    <input id="port" type="text" inputmode="numeric" placeholder="19132" autocomplete="off" aria-describedby="portErr">
    <div class="err" id="portErr" role="alert"></div>

    <div class="chkrow"><button class="btn alt mini" id="check" type="button">Cek Status</button><span class="st" id="chk" aria-live="polite"></span></div>

    <label class="chk" id="consentWrap"><input type="checkbox" id="consent"><span>Personalisasi Tambahan.</span></label>

    <button class="btn main" id="go" type="button">Masuk Minecraft</button>
    <div class="row">
      <button class="btn alt" id="save" type="button">Simpan Server</button>
      <button class="btn alt" id="copy" type="button">Salin IP:Port</button>
    </div>
    <button class="btn alt" id="addExt" type="button" style="margin-top:10px">Tambahkan ke Daftar Server</button>

    <div class="msg" id="msg" aria-live="polite"></div>
    <p class="note">Fitur ini bekerja di perangkat yang sudah terpasang Minecraft Bedrock (Android, iOS, Windows 10/11).</p>
  </div></section>

  <section class="card">
    <h2>Server Tersimpan</h2>
    <div class="body" style="padding-top:14px"><button class="btn alt" id="refresh" type="button" style="margin-bottom:12px">Segarkan Status</button><ul id="list"></ul></div>
  </section>
</div>

<div class="panel" id="tab-featured" role="tabpanel" aria-labelledby="t-featured" hidden>
  <section class="card">
    <h2>Featured Server</h2>
    <div class="body" style="padding-top:14px">
      <div id="refreshFWrap" style="text-align:right;margin-bottom:10px" hidden><button class="btn alt mini" id="refreshF" type="button">Segarkan</button></div>
      <div class="soon" id="soon"><b>Coming Soon!</b><span>Server pilihan akan segera hadir.</span></div>
      <ul id="featList"></ul>
    </div>
  </section>
</div>
</main>

<nav class="nav" role="tablist" aria-label="Menu">
  <button class="tab" role="tab" id="t-connect" data-tab="connect" aria-selected="true" aria-controls="tab-connect" type="button">
    <svg viewBox="0 0 7 7" aria-hidden="true"><path d="M0 3h5v1H0zM4 1h1v1H4zM5 2h1v1H5zM6 3h1v1H6zM5 4h1v1H5zM4 5h1v1H4z"/></svg><span>Connect</span>
  </button>
  <button class="tab" role="tab" id="t-featured" data-tab="featured" aria-selected="false" aria-controls="tab-featured" tabindex="-1" type="button">
    <svg viewBox="0 0 7 7" aria-hidden="true"><path d="M3 0h1v2H3zM0 2h7v1H0zM1 3h5v1H1zM2 4h3v1H2zM1 5h2v1H1zM4 5h2v1H4zM0 6h2v1H0zM5 6h2v1H5z"/></svg><span>Featured Server</span>
  </button>
</nav>

<script src="config.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var KEY = 'mcbe_servers_v1';
  var MAX = 20;

  /* Pengaturan dibaca dari config.js */
  var CFG = window.APP_CONFIG || {};
  var SCRIPT_URL = CFG.SCRIPT_URL || '';
  var SECRET = CFG.SECRET || '';
  var FEATURED = Array.isArray(CFG.FEATURED_SERVERS) ? CFG.FEATURED_SERVERS : [];
  var servers = [];

  /* ---------- Penyimpanan (localStorage dibungkus try/catch) ---------- */
  function load(){
    try{
      var r = JSON.parse(localStorage.getItem(KEY) || '[]');
      if(Array.isArray(r)) servers = r.filter(function(s){ return s && typeof s.ip === 'string' && typeof s.port === 'string'; }).slice(0, MAX);
    }catch(e){ servers = []; }
  }
  function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(servers)); }catch(e){} }

  /* ---------- Validasi input ---------- */
  function setErr(field, text){
    $(field + 'Err').textContent = text || '';
    $(field).classList.toggle('bad', !!text);
  }
  // Mengembalikan {name, ip, port} jika valid, atau null jika tidak
  function readForm(){
    var name = $('name').value.trim().replace(/\|/g, '') || 'My Server';
    var ip = $('ip').value.trim();
    var port = $('port').value.trim() || '19132';
    var ok = true;
    setErr('ip', ''); setErr('port', '');

    if(!ip){ setErr('ip', 'IP wajib diisi.'); ok = false; }
    else if(!/^[a-zA-Z0-9]([a-zA-Z0-9.\-]*[a-zA-Z0-9])?$/.test(ip)){
      setErr('ip', 'IP tidak valid. Hanya huruf, angka, titik, dan tanda minus, tanpa spasi.'); ok = false;
    }
    if(!/^\d+$/.test(port) || +port < 1 || +port > 65535){
      setErr('port', 'Port harus angka 1 sampai 65535.'); ok = false;
    }
    if(!ok) return null;
    return { name: name, ip: ip, port: String(parseInt(port, 10)) };
  }

  /* ---------- Deep link Minecraft Bedrock ---------- */
  function connectUrl(s){
    return 'minecraft://connect/?serverUrl=' + encodeURIComponent(s.ip) + '&serverPort=' + encodeURIComponent(s.port);
  }
  function addUrl(s){
    return 'minecraft://?addExternalServer=' + encodeURIComponent(s.name) + '|' + encodeURIComponent(s.ip + ':' + s.port);
  }
  function openLink(url, text){
    var m = $('msg');
    m.textContent = text + ' ';
    var a = document.createElement('a');
    a.href = url; a.target = '_top'; a.textContent = 'Ketuk di sini jika tidak terbuka.';
    m.appendChild(a);
    try{ window.location.href = url; }catch(e){}
  }

  /* ---------- Kirim ke Google Drive (hanya jika dicentang) ---------- */
  function sendLog(s, action){
    try{
      if(!SCRIPT_URL || !$('consent').checked) return;
      fetch(SCRIPT_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ key: SECRET, name: s.name, ip: s.ip, port: s.port, action: action })
      }).catch(function(){});
    }catch(e){}
  }

  /* ---------- Status server (API mcstatus.io, Bedrock) ---------- */
  var API = 'https://api.mcstatus.io/v2/status/bedrock/';
  var cache = {};            // simpan hasil sementara (API sendiri cache 5 menit)
  var queue = [], running = 0;

  function getStatus(ip, port){
    var k = (ip + ':' + port).toLowerCase(), c = cache[k];
    if(c && Date.now() - c.t < c.ttl) return Promise.resolve(c.v);
    return fetch(API + encodeURIComponent(ip) + ':' + encodeURIComponent(port))
      .then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); })
      .then(function(d){
        var p = d && d.players || {};
        var v = { ok: true, online: !!d.online,
          pl: typeof p.online === 'number' ? p.online : null,
          max: typeof p.max === 'number' ? p.max : null,
          ver: d.version && d.version.name ? String(d.version.name) : '',
          motd: d.motd && d.motd.clean ? String(d.motd.clean).split('\n')[0].trim() : '' };
        cache[k] = { t: Date.now(), ttl: 300000, v: v };
        return v;
      })
      .catch(function(){
        var v = { ok: false };
        cache[k] = { t: Date.now(), ttl: 60000, v: v };  // kegagalan diingat 1 menit agar tidak membanjiri API
        return v;
      });
  }
  // Antrean: maksimal 3 permintaan sekaligus
  function queueStatus(ip, port, cb){ queue.push([ip, port, cb]); pump(); }
  function pump(){
    while(running < 3 && queue.length){
      running++;
      (function(j){
        getStatus(j[0], j[1]).then(j[2]).catch(function(){}).then(function(){ running--; pump(); });
      })(queue.shift());
    }
  }
  function newBadge(s){
    var el = document.createElement('span'); el.className = 'st'; el.textContent = 'Memeriksa status...';
    queueStatus(s.ip, s.port, function(v){ applyStatus(el, v); });
    return el;
  }
  // Teks status memakai textContent (aman dari isi MOTD server)
  function applyStatus(el, v, detail){
    el.classList.remove('on', 'off');
    if(!v.ok){ el.textContent = 'Status tidak tersedia'; return; }
    if(!v.online){ el.classList.add('off'); el.textContent = '\u25CF Offline'; return; }
    el.classList.add('on');
    var t = '\u25CF Online';
    if(v.pl !== null) t += ' \u00B7 ' + v.pl + (v.max !== null ? '/' + v.max : '') + ' pemain';
    if(detail){ if(v.ver) t += ' \u00B7 ' + v.ver; if(v.motd) t += ' \u00B7 ' + v.motd; }
    el.textContent = t.slice(0, 140);
  }

  /* ---------- Riwayat ---------- */
  function remember(s, action){
    sendLog(s, action || 'Simpan');
    // Cegah duplikat: IP:PORT sama hanya memperbarui nama dan naik ke atas
    servers = servers.filter(function(x){ return !(x.ip.toLowerCase() === s.ip.toLowerCase() && x.port === s.port); });
    servers.unshift({ name: s.name, ip: s.ip, port: s.port });
    servers = servers.slice(0, MAX);
    persist(); render();
  }
  function render(){
    var ul = $('list');
    ul.textContent = '';
    if(!servers.length){
      var li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'Belum ada server tersimpan.';
      ul.appendChild(li);
      return;
    }
    servers.forEach(function(s, i){
      var li = document.createElement('li'); li.className = 'item';

      // Klik nama/IP = isi otomatis ke form
      var info = document.createElement('button'); info.type = 'button'; info.className = 'info';
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = s.name;
      var ad = document.createElement('span'); ad.className = 'ad'; ad.textContent = s.ip + ':' + s.port;
      info.appendChild(nm); info.appendChild(ad); info.appendChild(newBadge(s));
      info.addEventListener('click', function(){
        $('name').value = s.name; $('ip').value = s.ip; $('port').value = s.port;
        setErr('ip', ''); setErr('port', '');
        syncDim();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      var acts = document.createElement('div'); acts.className = 'acts';
      var enter = document.createElement('button'); enter.type = 'button'; enter.className = 'btn'; enter.textContent = 'Masuk';
      enter.addEventListener('click', function(){
        openLink(connectUrl(s), 'Membuka Minecraft... Jika tidak terbuka, pastikan Minecraft Bedrock sudah terpasang di perangkat ini.');
        remember(s, 'Masuk');
      });

      // Hapus dengan konfirmasi dua langkah (tanpa confirm() agar aman di semua browser)
      var del = document.createElement('button'); del.type = 'button'; del.className = 'btn danger'; del.textContent = 'Hapus';
      var armed = false, timer;
      del.addEventListener('click', function(){
        if(!armed){
          armed = true; del.textContent = 'Yakin?';
          timer = setTimeout(function(){ armed = false; del.textContent = 'Hapus'; }, 3000);
        } else {
          clearTimeout(timer);
          servers.splice(i, 1); persist(); render();
        }
      });

      acts.appendChild(enter); acts.appendChild(del);
      li.appendChild(info); li.appendChild(acts);
      ul.appendChild(li);
    });
  }

  /* ---------- Aksi tombol utama ---------- */
  function doGo(){
    var s = readForm(); if(!s) return;
    openLink(connectUrl(s), 'Membuka Minecraft... Jika tidak terbuka, pastikan Minecraft Bedrock sudah terpasang di perangkat ini.');
    remember(s, 'Masuk');
  }
  $('go').addEventListener('click', doGo);

  $('save').addEventListener('click', function(){
    var s = readForm(); if(!s) return;
    remember(s, 'Simpan');
    $('msg').textContent = 'Server "' + s.name + '" disimpan.';
  });

  $('addExt').addEventListener('click', function(){
    var s = readForm(); if(!s) return;
    openLink(addUrl(s), 'Menambahkan ke daftar server Minecraft...');
    remember(s, 'Tambah ke daftar');
  });

  $('copy').addEventListener('click', function(){
    var s = readForm(); if(!s) return;
    var text = s.ip + ':' + s.port;
    function done(){ $('msg').textContent = 'Disalin: ' + text; }
    function fallback(){
      var t = document.createElement('textarea');
      t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      try{ document.execCommand('copy'); done(); }catch(e){ $('msg').textContent = 'Gagal menyalin. Salin manual: ' + text; }
      document.body.removeChild(t);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, fallback);
    } else fallback();
  });

  // Tekan Enter di kolom mana pun = tombol Masuk
  ['name', 'ip', 'port'].forEach(function(id){
    $(id).addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); doGo(); } });
    $(id).addEventListener('input', function(){ if(id !== 'name') setErr(id, ''); syncDim(); });
  });

  /* ---------- Featured Server (dari config.js) ---------- */
  function renderFeatured(){
    var ul = $('featList'); ul.textContent = '';
    var list = FEATURED.filter(function(f){ return f && /^[a-zA-Z0-9]([a-zA-Z0-9.\-]*[a-zA-Z0-9])?$/.test(String(f.ip || '').trim()); });
    // Server dengan pin: true tampil paling atas (urutan lain tetap sesuai config)
    list = list.map(function(f, i){ return { f: f, i: i }; })
      .sort(function(a, b){ return (b.f.pin === true) - (a.f.pin === true) || a.i - b.i; })
      .map(function(x){ return x.f; });
    $('soon').hidden = list.length > 0;
    $('refreshFWrap').hidden = list.length === 0;
    list.forEach(function(f){
      var s = { name: String(f.name || 'Featured Server').replace(/\|/g, '').slice(0, 40), ip: String(f.ip).trim(), port: String(f.port || '19132') };
      var li = document.createElement('li'); li.className = 'item';
      var info = document.createElement('div'); info.className = 'info'; info.style.cursor = 'default';
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = s.name;
      info.appendChild(nm);
      if(f.pin === true){ var pt = document.createElement('span'); pt.className = 'tag'; pt.textContent = 'PIN'; info.insertBefore(pt, nm); }
      if(f.desc){ var d = document.createElement('span'); d.className = 'ad'; d.textContent = String(f.desc); info.appendChild(d); }
      var ad = document.createElement('span'); ad.className = 'ad'; ad.textContent = s.ip + ':' + s.port; info.appendChild(ad); info.appendChild(newBadge(s));
      var acts = document.createElement('div'); acts.className = 'acts';
      var enter = document.createElement('button'); enter.type = 'button'; enter.className = 'btn'; enter.textContent = 'Masuk';
      enter.addEventListener('click', function(){
        openLink(connectUrl(s), 'Membuka Minecraft...');
        sendLog(s, 'Masuk (featured)');
      });
      var sv = document.createElement('button'); sv.type = 'button'; sv.className = 'btn alt'; sv.textContent = 'Simpan';
      sv.addEventListener('click', function(){
        remember(s, 'Simpan (featured)');
        sv.textContent = 'Tersimpan';
        setTimeout(function(){ sv.textContent = 'Simpan'; }, 1500);
      });
      acts.appendChild(enter); acts.appendChild(sv);
      li.appendChild(info); li.appendChild(acts); ul.appendChild(li);
    });
  }

  /* ---------- Pindah tab tanpa reload ---------- */
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  function showTab(name){
    tabs.forEach(function(t){
      var on = t.dataset.tab === name;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      $('tab-' + t.dataset.tab).hidden = !on;
    });
    window.scrollTo({ top: 0 });
  }
  tabs.forEach(function(t, i){
    t.addEventListener('click', function(){ showTab(t.dataset.tab); });
    t.addEventListener('keydown', function(e){
      if(e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      var n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
      showTab(n.dataset.tab); n.focus();
    });
  });
  renderFeatured();

  if(!SCRIPT_URL) $('consentWrap').style.display = 'none';
  try{ $('consent').checked = true; }catch(e){}
  $('consent').addEventListener('change', function(){
    try{ localStorage.setItem('mcbe_consent', this.checked ? '1' : '0'); }catch(e){}
  });

  // Tombol Cek Status di form
  $('check').addEventListener('click', function(){
    var s = readForm(); if(!s) return;
    var el = $('chk'); el.classList.remove('on', 'off'); el.textContent = 'Memeriksa status...';
    getStatus(s.ip, s.port).then(function(v){ applyStatus(el, v, true); });
  });
  // Segarkan semua status (hapus cache lalu gambar ulang)
  $('refresh').addEventListener('click', function(){ cache = {}; render(); renderFeatured(); });

  // Tombol abu-abu selama IP kosong (tetap bisa diklik untuk memunculkan pesan error)
  function syncDim(){
    var empty = !$('ip').value.trim();
    ['go', 'save', 'copy', 'addExt', 'check'].forEach(function(id){
      var b = $(id); b.classList.toggle('dim', empty); b.setAttribute('aria-disabled', empty ? 'true' : 'false');
    });
  }
  // Segarkan status server Featured
  $('refreshF').addEventListener('click', function(){ cache = {}; renderFeatured(); });
  syncDim();

  load(); render();
})();
</script>
</body>
</html>
